app-id: io.github.eidan_linux.MiniPrint
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: miniprint.py
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=home:ro
  - --system-talk-name=org.bluez
modules:
  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "pillow" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/source/p/pillow/pillow-11.1.0.tar.gz
        sha256: 368da70800b36d750c81edf0be79b1f5a4b906b95f97e6e68a247e2517d9a7b7
  - name: miniprint
    buildsystem: simple
    build-commands:
      - install -Dm755 miniprint.py /app/bin/miniprint.py
      - install -Dm644 io.github.eidan_linux.MiniPrint.desktop /app/share/applications/io.github.eidan_linux.MiniPrint.desktop
      - install -Dm644 io.github.eidan_linux.MiniPrint.metainfo.xml /app/share/metainfo/io.github.eidan_linux.MiniPrint.metainfo.xml
      - install -Dm644 icono.png /app/share/icons/hicolor/128x128/apps/io.github.eidan_linux.MiniPrint.png
    sources:
      - type: archive
        url: https://github.com/eidan-linux/MiniPrint-Linux/archive/refs/heads/main.tar.gz
        sha256: 1b25b4eed020b373028fa924eb8e91285d44d72d77c68259ec936da8659207b1
